<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>동물과 대화하기</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f1ea;
    --panel: #ffffff;
    --text: #2b2b2b;
    --muted: #8a8578;
    --accent: #e8834a;
    --bubble-user: #e8834a;
    --bubble-user-text: #ffffff;
    --bubble-bot: #ffffff;
    --border: #e5ddcf;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 480px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    box-shadow: 0 0 24px rgba(0,0,0,0.08);
  }
  header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header .title {
    font-weight: 700;
    font-size: 18px;
    flex: 1;
  }
  .character-tabs {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .character-tab {
    flex: 0 0 auto;
    padding: 10px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg);
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    color: var(--muted);
    transition: all 0.15s ease;
  }
  .character-tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .character-tab.add {
    color: var(--accent);
    border-style: dashed;
  }

  .create-panel {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .create-panel input {
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    font-size: 14px;
    background: var(--bg);
    color: var(--text);
  }
  .create-panel .hint {
    font-size: 12px;
    color: var(--muted);
  }
  .create-panel .actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }
  .create-panel button {
    padding: 8px 16px;
    border-radius: 999px;
    border: none;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }
  .create-panel button.primary { background: var(--accent); color: #fff; }
  .create-panel button.ghost { background: transparent; color: var(--muted); }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bubble-row { display: flex; }
  .bubble-row.user { justify-content: flex-end; }
  .bubble-row.bot { justify-content: flex-start; }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .bubble-row.user .bubble {
    background: var(--bubble-user);
    color: var(--bubble-user-text);
    border-bottom-right-radius: 4px;
  }
  .bubble-row.bot .bubble {
    background: var(--bubble-bot);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .bubble-row.bot .bubble.typing { color: var(--muted); font-style: italic; }
  form.chat-form {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid var(--border);
  }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    font-size: 15px;
    outline: none;
    background: var(--bg);
    color: var(--text);
  }
  input[type="text"]:focus { border-color: var(--accent); }
  button.send {
    padding: 0 18px;
    border-radius: 999px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  button.send:disabled { opacity: 0.5; cursor: default; }
  .empty-hint {
    margin: auto;
    color: var(--muted);
    font-size: 14px;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title">🐾 동물과 대화하기</div>
    </header>

    <div class="character-tabs" id="characterTabs"></div>

    <div class="create-panel" id="createPanel" style="display: none;">
      <input type="text" id="nicknameInput" placeholder="닉네임 (예: 멍이)" />
      <input type="text" id="animalTypeInput" placeholder="동물 종류 (예: DOG, CAT, RABBIT ...)" />
      <input type="text" id="breedsInput" placeholder="혈통 구성 (예: 슈나우저 70, 진돗개 20, 닥스훈트 10)" />
      <div class="hint">혈통 구성은 "품종 비율" 쌍을 쉼표로 구분해서 입력하세요. 비워도 됩니다.</div>
      <div class="actions">
        <button type="button" class="ghost" id="cancelCreateBtn">취소</button>
        <button type="button" class="primary" id="submitCreateBtn">캐릭터 만들기</button>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="empty-hint" id="emptyHint">오른쪽 위 + 탭에서 캐릭터를 먼저 만들어주세요!</div>
    </div>
    <form class="chat-form" id="chatForm">
      <input type="text" id="messageInput" placeholder="메시지를 입력하세요" autocomplete="off" disabled />
      <button type="submit" class="send" id="sendBtn" disabled>전송</button>
    </form>
  </div>

<script>
  const API_BASE = window.location.origin;
  const userId = (() => {
    let id = localStorage.getItem("animal_chat_user_id");
    if (!id) {
      id = "web-" + Math.random().toString(36).slice(2, 10);
      localStorage.setItem("animal_chat_user_id", id);
    }
    return id;
  })();

  const CHARACTERS_KEY = "animal_chat_characters";
  function loadCharacters() {
    try {
      return JSON.parse(localStorage.getItem(CHARACTERS_KEY) || "[]");
    } catch {
      return [];
    }
  }
  function saveCharacters(list) {
    localStorage.setItem(CHARACTERS_KEY, JSON.stringify(list));
  }

  let characters = loadCharacters();
  let currentNickname = characters[0]?.nickname ?? null;
  const historyByCharacter = {};

  const tabsEl = document.getElementById("characterTabs");
  const createPanelEl = document.getElementById("createPanel");
  const messagesEl = document.getElementById("messages");
  const formEl = document.getElementById("chatForm");
  const inputEl = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");

  function renderTabs() {
    tabsEl.innerHTML = "";
    for (const c of characters) {
      const tab = document.createElement("div");
      tab.className = "character-tab" + (c.nickname === currentNickname ? " active" : "");
      tab.textContent = c.nickname;
      tab.addEventListener("click", () => selectCharacter(c.nickname));
      tabsEl.appendChild(tab);
    }
    const addTab = document.createElement("div");
    addTab.className = "character-tab add";
    addTab.textContent = "+ 새 캐릭터";
    addTab.addEventListener("click", () => {
      createPanelEl.style.display = "flex";
    });
    tabsEl.appendChild(addTab);
  }

  function selectCharacter(nickname) {
    currentNickname = nickname;
    createPanelEl.style.display = "none";
    inputEl.disabled = false;
    sendBtn.disabled = false;
    renderTabs();
    if (!historyByCharacter[nickname]) {
      historyByCharacter[nickname] = [];
    }
    renderMessages();
    inputEl.focus();
  }

  function renderMessages() {
    messagesEl.innerHTML = "";
    const history = currentNickname ? (historyByCharacter[currentNickname] || []) : [];
    if (history.length === 0) {
      const hint = document.createElement("div");
      hint.className = "empty-hint";
      hint.textContent = currentNickname
        ? "인사를 건네보세요!"
        : "오른쪽 위 + 탭에서 캐릭터를 먼저 만들어주세요!";
      messagesEl.appendChild(hint);
      return;
    }
    for (const msg of history) {
      const row = document.createElement("div");
      row.className = `bubble-row ${msg.role === "user" ? "user" : "bot"}`;
      const bubble = document.createElement("div");
      bubble.className = "bubble" + (msg.typing ? " typing" : "");
      bubble.textContent = msg.content;
      row.appendChild(bubble);
      messagesEl.appendChild(row);
    }
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function parseBreeds(text) {
    return text
      .split(",")
      .map((chunk) => chunk.trim())
      .filter(Boolean)
      .map((chunk) => {
        const match = chunk.match(/^(.+?)\s+(\d+)$/);
        if (!match) return null;
        return { breed: match[1].trim(), percent: parseInt(match[2], 10) };
      })
      .filter(Boolean);
  }

  document.getElementById("cancelCreateBtn").addEventListener("click", () => {
    createPanelEl.style.display = "none";
  });

  document.getElementById("submitCreateBtn").addEventListener("click", async () => {
    const nickname = document.getElementById("nicknameInput").value.trim();
    const animalType = document.getElementById("animalTypeInput").value.trim();
    const breedsText = document.getElementById("breedsInput").value.trim();
    if (!nickname || !animalType) {
      alert("닉네임과 동물 종류는 필수예요.");
      return;
    }
    const breeds = parseBreeds(breedsText);

    try {
      const res = await fetch(`${API_BASE}/api/characters`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          nickname,
          animalType,
          breeds,
          userId,
        }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        alert(`캐릭터 생성 실패: ${err.detail ?? res.status}`);
        return;
      }
    } catch (err) {
      alert("서버에 연결할 수 없어요. 서버가 켜져 있는지 확인해주세요.");
      return;
    }

    if (!characters.some((c) => c.nickname === nickname)) {
      characters.push({ nickname, animalType });
      saveCharacters(characters);
    }
    document.getElementById("nicknameInput").value = "";
    document.getElementById("animalTypeInput").value = "";
    document.getElementById("breedsInput").value = "";
    selectCharacter(nickname);
  });

  formEl.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!currentNickname) return;
    const text = inputEl.value.trim();
    if (!text) return;

    const history = historyByCharacter[currentNickname];
    history.push({ role: "user", content: text });
    inputEl.value = "";
    sendBtn.disabled = true;
    inputEl.disabled = true;

    const typingMsg = { role: "assistant", content: "...", typing: true };
    history.push(typingMsg);
    renderMessages();

    try {
      const res = await fetch(`${API_BASE}/api/chat/message`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nickname: currentNickname, message: text }),
      });
      const idx = history.indexOf(typingMsg);
      if (!res.ok) {
        const errBody = await res.json().catch(() => ({}));
        history[idx] = { role: "assistant", content: `(오류가 발생했어요: ${errBody.detail ?? res.status})` };
      } else {
        const data = await res.json();
        history[idx] = { role: "assistant", content: data.reply };
      }
    } catch (err) {
      const idx = history.indexOf(typingMsg);
      history[idx] = { role: "assistant", content: "(서버에 연결할 수 없어요. 서버가 켜져 있는지 확인해주세요.)" };
    } finally {
      sendBtn.disabled = false;
      inputEl.disabled = false;
      inputEl.focus();
      renderMessages();
    }
  });

  renderTabs();
  if (currentNickname) {
    selectCharacter(currentNickname);
  } else {
    renderMessages();
  }
</script>
</body>
</html>
